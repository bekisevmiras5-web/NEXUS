function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function date(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function plus(s,n){let d=date(s);d.setDate(d.getDate()+n);return key(d)}function fmt(s,opts={weekday:'long',day:'numeric',month:'long'}){return date(s).toLocaleDateString('ru-RU',opts)}function id(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function mins(t){let [h,m]=(t||'00:00').split(':').map(Number);return h*60+m}
function defaults(){let tasks=[];function add(d,a,b,title,cat,desc='',priority='required'){tasks.push({id:id(),date:d,start:a,end:b,title,category:cat,description:desc,priority,repeat:'weekly',status:'pending',template:true})}for(let i=0;i<75;i++){let d=plus(today(),i),w=date(d).getDay();if([1,3,5].includes(w)){add(d,'08:00','09:00','Подъём, завтрак и сборы','Здоровье','Гигиена и подготовка');add(d,'09:00','16:00','Школа','Учёба','Уроки и школьные задания');add(d,'16:00','16:20','Перерыв и перекус','Отдых','','optional');add(d,'16:20','18:00','Информатика','Информатика','Теория, задачи ЕНТ, разбор ошибок');add(d,'18:00','18:30','Отдых и еда','Отдых','','optional');add(d,'18:30','20:00','История Казахстана','История Казахстана','Темы, даты, личности и тесты');add(d,'20:00','21:00','Ужин и свободное время','Отдых','','optional');add(d,'21:00','21:30',w===1?'Математика: практика':w===3?'Разбор ошибок пробника':'Повторение слабых тем','Математика','Короткий блок','optional');add(d,'21:30','22:30','Подготовка ко сну','Здоровье','Вещи на завтра, гигиена','optional');add(d,'22:30','23:00','Отбой','Здоровье','Начать сон около 22:30')}else if([2,4].includes(w)){add(d,'08:00','09:00','Подъём и сборы','Здоровье','Гигиена и завтрак');add(d,'09:00','15:00','Школа','Учёба','Школьные уроки');add(d,'15:00','15:30','Перекус и дорога','Отдых','','optional');add(d,'15:30','17:00','Стажировка','Стажировка','');add(d,'17:00','18:30','Дорога, еда и отдых','Отдых','','optional');add(d,'18:30','19:30','Домашние задания или повторение ЕНТ','ЕНТ','Выбрать главный приоритет');add(d,'19:30','20:00','Ужин и перерыв','Отдых','','optional');add(d,'20:00','21:00','Учебные материалы','Учёба','Чтение книг, видео, конспект','optional');add(d,'21:00','22:30','Свободное время и подготовка ко сну','Здоровье','','optional');add(d,'22:30','23:00','Отбой','Здоровье','')}else if(w===6){add(d,'08:00','20:00','Работа','Работа','Полный рабочий день — время можно изменить');add(d,'20:00','22:00','Ужин и восстан function nav(p){page=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+p));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));header();if(p==='scores')setTimeout(drawChart,30);scrollTo({top:0,behavior:'smooth'})}function render(){renderNow();renderWeek();renderYear();renderScores();renderSettings();document.documentElement.dataset.theme=state.theme==='forest'?'forest':state.theme==='violet'?'violet':'midnight';sideStreak();header()}
function openTask(t=null,d=selectedDate){editing=t?.id||null;document.getElementById('taskModalTitle').textContent=t?'Редактировать задачу':'Новая задача';[['tTitle',t?.title||''],['tDate',t?.date||d],['tCat',t?.category||'Учёба'],['tStart',t?.start||'18:00'],['tEnd',t?.end||'19:00'],['tPriority',t?.priority||'required'],['tRepeat',t?.repeat||'none'],['tDesc',t?.description||'']].forEach(([k,v])=>document.getElementById(k).value=v);document.getElementById('taskModal').classList.add('open')}function closeTask(){document.getElementById('taskModal').classList.remove('open');editing=null}function ask(title,body,label,cb){confirmCb=cb;document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmBody').textContent=body;document.getElementById('confirmOk').textContent=label||'Подтвердить';document.getElementById('confirmModal').classList.add('open')}function closeConfirm(){document.getElementById('confirmModal').classList.remove('open');confirmCb=null}
function toggle(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;t.status=done(t)?'pending':'done';t.completedAt=done(t)?new Date().toISOString():null;save();render();toast(done(t)?'Задача выполнена':'Отметка снята')}function moveTask(taskId){let t=state.tasks.find(x=>x.id===taskId);if(!t)return;let d=prompt('На какую дату перенести? Формат ГГГГ-ММ-ДД',plus(t.date,1));if(!d)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('Проверь формат даты');return}ask('Подтвердить перенос',`Перенести «${t.title}» с ${t.date} на ${d}? Исходный день останется в истории.`, 'Перенести',()=>{state.tasks.push({...t,id:id(),date:d,status:'pending',repeat:'none',template:false,completedAt:null});if(t.repeat!=='weekly')t.status='moved';save();render();toast('Задача перенесена')})}
document.getElementById('taskForm').addEventListener('submit',e=>{e.preventDefault();let title=document.getElementById('tTitle').value.trim(),d=document.getElementById('tDate').value,a=document.getElementById('tStart').value,b=document.getElementById('tEnd').value;if(!title||!d||!a||!b||b<=a){toast('Проверь название, дату и время');return}let f={title,date:d,start:a,end:b,category:document.getElementById('tCat').value,priority:document.getElementById('tPriority').value,repeat:document.getElementById('tRepeat').value,description:document.getElementById('tDesc').value.trim()};if(editing){let t=state.tasks.find(x=>x.id===editing);if(t)Object.assign(t,f,{template:false})}else{state.tasks.push({id:id(),...f,status:'pending',createdAt:new Date().toISOString(),template:false});if(f.repeat==='weekly')for(let i=1;i<=12;i++)state.tasks.push({id:id(),...f,date:plus(d,7*i),repeat:'weekly-instance',status:'pending',template:false,createdAt:new Date().toISOString()})}selectedDate=d;closeTask();save();render();toast('Задача сохранена')});document.getElementById('cancelTask').onclick=closeTask;
function addTopic(t=null){let title=prompt(t?'Название темы':'Название новой темы',t?.title||'');if(title===null)return;if(!title.trim()){toast('Название не может быть пустым');return}let note=prompt('Заметка / следующий шаг',t?.note||'Теория → практика → тест → повторение');if(note===null)return;if(t){t.title=title.trim();t.note=note.trim()}else state.topics.push({id:id(),month:selectedMonth,subject:selectedSubject,title:title.trim(),note:note.trim(),status:'Не начата'});save();render();nav('year');toast('Тема сохранена')}
function scoreSubmit(e){e.preventDefault();let total=+document.getElementById('sTotal').value,d=document.getElementById('sDate').value;if(!d||!Number.isInteger(total)||total<0||total>140){toast('Общий балл должен быть от 0 до 140');return}function val(k,max){let v=document.getElementById(k).value;if(v==='')return null;let n=+v;if(!Number.isInteger(n)||n<0||n>max)throw Error(`Значение должно быть от 0 до ${max}`);return n}try{let s={id:id(),date:d,total,math:val('sMath',50),informatics:val('sInfo',50),history:val('sHist',20),mathLit:val('sML',10),reading:val('sRead',10),notes:document.getElementById('sNotes').value.trim()};state.scores=state.scores.filter(x=>x.date!==d||x.baseline);state.scores.push(s);save();render();nav('scores');toast('Результат сохранён')}catch(err){toast(err.message)}}function editBaseline(){let s=state.scores.find(x=>x.baseline)||state.scores[0];if(!s)return;let d=prompt('Дата стартового результата (ГГГГ-ММ-ДД). Оставь пустым, если неизвестна.',s.date||'');if(d===null)return;if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('Неверный формат даты');return}let n=prompt('Общий балл из 140',s.total);if(n===null)return;n=+n;if(!Number.isInteger(n)||n<0||n>140){toast('Баллы должны быть от 0 до 140');return}s.date=d;s.total=n;s.baseline=false;save();render();toast('Стартовый результат обновлён')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nexus-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Резервная копия создана')}function importData(file){let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(o.version!==1||!Array.isArray(o.tasks)||!Array.isArray(o.topics)||!Array.isArray(o.scores)||!o.settings)throw Error('Файл не похож на резервную копию NEXUS');ask('Импортировать данные?',`Заменить текущие данные на ${o.tasks.length} задач, ${o.topics.length} тем и ${o.scores.length} результатов? Сначала рекомендуется экспортировать текущую копию.`, 'Импортировать',()=>{state=o;save();selectedDate=today();render();nav('now');toast('Данные импортированы')})}catch(err){toast('Ошибка импорта: '+err.message)}};r.readAsText(file)}
function summary(){let d=today(),a=tasksOn(d),r=req(d),miss=a.filter(t=>!done(t)&&t.priority!=='optional'&&taskStatus(t)==='Не выполнено'),s=streak();let text=`Итог дня — ${fmt(d)}\nВыполнено: ${a.filter(done).length}/${a.length} (${progress(d)}%).\nОбязательные: ${r.filter(done).length}/${r.length}.\nСерия: ${s.n}; рекорд: ${s.record}.\nНевыполненные: ${miss.map(t=>t.title).join(', ')||'нет'}.\n\nЗавтра:\n${tasksOn(plus(d,1)).map(t=>t.start+' '+t.title).join('\n')}`;ask('Вечерний итог',`${fmt(d)}\nВыполнено: ${a.filter(done).length}/${a.length} задач (${progress(d)}%).\nОбязательные выполнены: ${r.filter(done).length}/${r.length}.\nСерия: ${s.n} дн. · рекорд ${s.record} дн.\n\n${miss.length?'Невыполненные обязательные: '+miss.map(t=>t.title).join(', '):'Нет пропущенных обязательных задач.'}\n\nЗавтра: ${tasksOn(plus(d,1)).map(t=>t.title).join(', ')||'план пуст'}.`, 'Скопировать итог',()=>{if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Итог скопирован')).catch(()=>toast(text));else toast(text)});state.settings.lastSummaryDate=d;save()}
function reset(){ask('Сбросить NEXUS?','Все локальные задачи, темы и результаты будут удалены. Сначала экспортируй резервную копию.','Сбросить',()=>{localStorage.removeItem(KEY);state=defaults();save();render();nav('now');toast('Данные сброшены')})}
function action(el){let a=el.dataset.act,i=el.dataset.id;switch(a){case'toggle':toggle(i);break;case'edit':openTask(state.tasks.find(t=>t.id===i));break;case'move':moveTask(i);break;case'add':openTask(null,selectedDate);break;case'goto':nav(el.dataset.page);break;case'date':selectedDate=el.dataset.date;renderWeek();break;case'shift':selectedDate=plus(selectedDate,+el.dataset.n);renderWeek();break;case'month':selectedMonth=el.dataset.month;renderYear();break;case'subject':selectedSubject=el.dataset.subject;renderYear();break;case'addtopic':addTopic();break;case'edittopic':addTopic(state.topics.find(t=>t.id===i));break;case'deltopic':ask('Удалить тему?','Тема будет удалена из плана.','Удалить',()=>{state.topics=state.topics.filter(t=>t.id!==i);save();render()});break;case'editbaseline':editBaseline();break;case'delscore':ask('Удалить результат?','Удалить выбранную запись из истории пробников?','Удалить',()=>{state.scores=state.scores.filter(s=>s.id!==i);save();render()});break;case'export':exportData();break;case'import':document.getElementById('importFile').click();break;case'summary':summary();break;case'savesummarytime':state.settings.summaryTime=document.getElementById('summaryTime').value;save();toast('Время сохранено');break;case'reset':reset();break}}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){nav(n.dataset.page);return}let th=e.target.closest('[data-theme]');if(th){state.theme=th.dataset.theme;save();render();toast('Тема: '+state.theme);return}let a=e.target.closest('[data-act]');if(a&&!(a.dataset.act==='toggle'&&a.matches('input[type=checkbox]')))action(a)});document.addEventListener('change',e=>{let t=e.target;if(t.dataset.act==='toggle'){toggle(t.dataset.id);return}if(t.dataset.act==='topicstatus'){let x=state.topics.find(q=>q.id===t.dataset.id);if(x){x.status=t.value;save();renderYear()}return}if(t.id==='chartMode'){chartMode=t.value;renderScores()} });document.getElementById('page-scores').addEventListener('submit',e=>{if(e.target.id==='scoreForm')scoreSubmit(e)});document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});document.getElementById('quickAdd').onclick=()=>openTask();document.getElementById('confirmCancel').onclick=closeConfirm;document.getElementById('confirmOk').onclick=()=>{let cb=confirmCb;closeConfirm();if(cb)cb()};window.addEventListener('resize',()=>{if(page==='scores')drawChart()});
function tick(){header();sideStreak();if(page==='now')renderNow();let now=new Date(),tm=state.settings.summaryTime||'21:30';if(now.toTimeString().slice(0,5)===tm&&state.settings.lastSummaryDate!==today())summary()}render();nav('now');setInterval(tick,1000);
</script></body></html>
